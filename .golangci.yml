version: "2"

run:
  timeout: 5m
  build-tags:
    - sqlite_foreign_keys

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: blank-imports
          disabled: true
